name: Backend Build and Docker Push

on:
  push:
    branches: ["master"]
jobs:
  build-and-push-backend:
    name: Build & Push Backend Docker Image
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Java (for Maven build)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Give execute permission to Maven Wrapper
        working-directory: ./spring-boot-server
        run: chmod +x mvnw 
   
        
      # Step 3: Build Spring Boot JAR
      - name: Build backend with Maven
        working-directory: ./spring-boot-server
        run: ./mvnw clean install 

      # Step 4: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Step 5: Build Docker image
      - name: Build Docker image
        working-directory: ./spring-boot-server
        run: |
          docker build -t ${{  secrets.DOCKERHUB_USERNAME }}/springboot-backend:latest .
      # Step 6: Push Docker image
      - name: Push Docker image
        run: |
          docker push ${{  secrets.DOCKERHUB_USERNAME }}/springboot-backend:latest
